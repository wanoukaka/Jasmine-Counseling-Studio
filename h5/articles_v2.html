<script>
var ARTICLES_JSON = {"last_updated": "2026-04-17", "daily_featured_id": 34, "articles": [{"id": 1, "cat": "love", "tag": "婚恋心理", "tagClass": "tag-love", "title": "恋爱里的五感法则：提升情感温度的秘诀", "date": "2026-04-08", "author": "王琳老师", "isFeatured": true, "excerpt": "恋爱中的每一刻都值得珍视，五感法则让我们学会用心感受，用爱回应，让亲密关系更加稳固和谐。", "content": "<p>在纷繁忙碌的生活中，我们往往忽略了与伴侣之间的深度交流。恋爱里的五感法则（视觉、听觉、嗅觉、味觉、触觉）为我们提供了一种全新的视角，去体验和深化彼此之间的情感连接。通过精心准备一顿美味佳肴，我们不仅能共享美食的美味，更能在这个过程中感受到对方的心意与关注。<div class=\"highlight\">视觉上精心布置的浪漫场景，听觉中一曲专属于对方的歌曲，嗅觉中对方身上那熟悉的味道，味觉上共享的每一道美食，以及触觉上的每一次拥抱，都是我们保持爱情新鲜感的法宝。</div>每一次的用心，都能让爱的力量在双方的心中驻足。亲密关系中的小确幸，就是这些温暖的瞬间，它们如同点点星光，照亮我们的生活。</p><p><strong>金句：</strong>每一个温暖的瞬间，都是爱情里最珍贵的礼物，用心感受，用爱传递。</p>"}, {"id": 2, "cat": "emotion", "tag": "情绪管理", "tagClass": "tag-emotion", "title": "掌握情绪钥匙，开启幸福婚姻之门", "date": "2026-04-08", "author": "王琳老师", "isFeatured": false, "excerpt": "学会情绪管理，婚恋关系更加和谐美满。掌握情绪钥匙，开启幸福婚姻之门。", "content": "<p>情绪是人际关系的晴雨表。在婚恋中，情绪管理不仅能避免不必要的冲突，还能增进彼此的理解。识别情绪类型，学会表达自己的情感，是关键的第一步。比如，当你感到生气时，试着用“I”语句表达，比如“I感到...”，而不是“你让我生气”。这种表达方式既不会使对方感到被指责，也能更有效地沟通你的感受。</p>\n<div class=\"highlight\">情绪管理在于学会识别和表达，而非压抑或逃避。</div>\n<p>沟通是伴侣间心灵相通的桥梁。当双方能够共情对方的情绪，就能建立更加坚固的信任。比如，当伴侣表达不满时，试着从他的角度思考，理解背后的原因，而非立即反驳。</p>\n<p>最后，记住每个人都有情绪波动的时候，这是正常的。通过正念冥想等方法，帮助自己保持内心的平静，从而更好地应对生活中的情绪挑战。</p>\n<p>幸福的婚姻，需要双方不断学习和成长。愿你们携手共进，开启更加美好的人生旅程。</p>"}, {"id": 3, "cat": "family", "tag": "原生家庭", "tagClass": "tag-family", "title": "原生家庭对亲密关系的影响", "date": "2026-04-08", "author": "王琳老师", "isFeatured": false, "excerpt": "了解原生家庭如何塑造我们的亲密关系，学习如何建立健康、和谐的关系。", "content": "<p>原生家庭是我们生命之初的课堂，它塑造着我们对爱与被爱的理解。家庭环境如父母的互动模式、沟通方式以及解决冲突的方式，都会深深影响到我们怎样的看待世界和人际关系。</p><div class=\"highlight\">比如，一个充满爱与支持的家庭能培养出自信和安全感，使个体在未来的恋情中更加从容。</div><p>金句：了解自己的原生家庭，能够帮助我们更好地理解自我，从而促进更健康、更和谐的亲密关系。</p>"}, {"id": 4, "cat": "growth", "tag": "自我成长", "tagClass": "tag-growth", "title": "自我成长：婚恋关系中的相互成就", "date": "2026-04-08", "author": "王琳老师", "isFeatured": false, "excerpt": "在这个充满变化的时代，我们如何在婚恋关系中找到自我成长的机会？让我们一起探索如何在亲密关系中实现个人进阶。", "content": "<div>在婚姻或亲密关系中，双方的成长其实是相互促进的过程。尊重彼此的成长空间，共同面对生活中的挑战，是关系长久的基石。</div><p>每个人都是独特的个体，拥有自己的梦想与追求。在伴侣关系中，鼓励对方追求梦想，不仅能够增进感情，还能让彼此的关系更加坚固。</p><div>沟通是维系关系的重要方式。定期进行情感交流，表达真实的感受，有助于双方更好地理解和支持彼此。</div><strong>关键在于，携手共创属于两个人的美好未来，而不是单方面牺牲或强迫。</strong><p>记住，每一步成长都值得庆祝，无论是对个人还是对关系。</p>"}, {"id": 5, "cat": "emotion", "tag": "情绪管理", "tagClass": "tag-emotion", "title": "如何有效管理情绪：以爱为桥，平稳前行", "date": "2026-04-06", "author": "王琳老师", "isFeatured": false, "excerpt": "在婚恋与亲密关系中，情绪管理至关重要。如何有效管理情绪，让情感关系更加稳定和温馨？", "content": "<p>情绪管理是每个人都需要掌握的技能，尤其在婚恋和亲密关系中更为重要。<strong>学会倾听自己的内心感受</strong>，并适当表达，是维持健康情感的关键。</p>\n\n<div class=\"highlight\">学会情绪管理，不仅让自己更加理智，也能让伴侣感受到你的理解和支持。</div>\n\n<p>在面对矛盾和挑战时，保持冷静和理解，用爱去沟通，可以化干戈为玉帛，让关系更稳固。记住，<strong>每一段关系都是心灵的磨合与成长</strong>，学会调整自己的情绪，才能更好地与伴侣共度人生旅程。</p>"}, {"id": 6, "cat": "family", "tag": "原生家庭", "tagClass": "tag-family", "title": "原生家庭的塑造力：构建和谐亲密关系", "date": "2026-04-06", "author": "王琳老师", "isFeatured": false, "excerpt": "原生家庭对个人的情感模式有着深远影响。了解其影响，帮助我们在亲密关系中找到平衡。", "content": "<p>原生家庭是塑造我们情感模式的第一所学校。它影响着我们对爱与被爱的理解，以及我们处理亲密关系的方式。<div class=\"highlight\">人们往往会在亲密关系中重复原生家庭中的情感模式，无论是积极的还是消极的。</div>正视这个问题，可以帮助我们意识到这些模式，并学会如何打破它们，建立更加健康的关系。</p><p>我们每个人都是自己情感故事的编写者。理解自己的原生家庭，可以让我们在面对问题时，更加从容和自信，更好地处理情感纠葛。</p><p>一句金句：理解并爱自己，是通往健康亲密关系的第一步。</p>"}, {"id": 7, "cat": "growth", "tag": "自我成长", "tagClass": "tag-growth", "title": "爱自己，才能拥有更好的爱情", "date": "2026-04-06", "author": "王琳老师", "isFeatured": false, "excerpt": "每个人都值得拥有幸福的婚姻和健康的人际关系。了解自己，爱自己，才能更好地去爱他人。", "content": "<p>在追求美好爱情的路上，我们常被外界的声音所影响，忘记了聆听内心的声音。自我成长不仅仅是学习新知识，更重要的是理解并接纳自己。只有当我们学会爱自己，才能在这个过程中建立起健康的人际关系。<div class=\"highlight\">通过正念练习，每天给自己一个微笑，你会发现生活中的美好。</div>当我们拥有了自爱的能力，就能更加从容地面对生活中的挑战和挫折。</p><p>心理学家建议，可以通过写日记、冥想等方式，来帮助我们更好地了解自己。当我们能够敞开心扉，真诚地面对自己的情绪，就能更好地处理人际关系中的冲突。记住，<span class=\"quote\">真正的爱情始于自我接纳，终于自我成长。</span></p>"}, {"id": 8, "cat": "emotion", "tag": "情绪管理", "tagClass": "tag-emotion", "title": "掌握情绪管理，提升亲密关系", "date": "2026-04-04", "author": "王琳老师", "isFeatured": false, "excerpt": "学会合理处理情绪，能让你在婚恋和亲密关系中更加从容自信。", "content": "<p>在人际关系中，情绪管理至关重要。掌握如何识别和表达自己的情绪，不仅能促进相互理解，还能帮助缓解冲突。通过有效的沟通技巧，如积极倾听和同理心表达，可以显著提升亲密关系的质量。（<div class=\"highlight\">情绪管理的关键在于认识并表达真实情感。</div>）</p>\n<p>不妨尝试每天记录情绪日记，这有助于你更好地理解自己情绪的触发因素，从而找到应对策略。记住，每个人情绪波动是正常的，关键是学会调整。</p>\n<p><strong>金句：</strong>“真正的亲密关系，是从心出发的彼此理解与包容。”</p>"}, {"id": 9, "cat": "family", "tag": "原生家庭", "tagClass": "tag-family", "title": "原生家庭对婚恋关系的影响", "date": "2026-04-04", "author": "王琳老师", "isFeatured": false, "excerpt": "原生家庭影响了我们的情感模式，理解它有助于个人成长与亲密关系的和谐。", "content": "<p>原生家庭环境对个体的情感模式有着深远影响。父母的相处模式、家庭氛围及家庭成员间的关系，潜移默化地塑造着我们对亲密关系的认知与期望。了解自己的原生家庭，有助于我们更好地认识自我，理解与接受自己的情感需要。</p><div class=\"highlight\">理解原生家庭，是自我成长的重要一环。</div><p>在处理亲密关系时，意识到原生家庭带来的影响，可以帮助我们识别潜在的情感模式，使我们在面对问题时更具觉察能力，从而促进更健康、更和谐的亲密关系。</p><p>因此，无论是在个人成长还是在建立恋爱关系中，意识到原生家庭的影响，都是不可或缺的一步。</p><p class=\"quote\">“了解原生家庭，就像是给我们的心理成长之路提供了一盏明灯。”</p>"}, {"id": 10, "cat": "love", "tag": "婚恋心理", "tagClass": "tag-love", "title": "为什么你的恋爱总是三天就分手？", "date": "2026-04-09", "author": "王琳老师", "isFeatured": false, "excerpt": "有些人总是反复陷入快速恋爱、快速分手的循环，心理学称之为强迫性重复。今天我们来解析这个现象。", "content": "<p>你是否有过这样的经历：每次恋爱都很快开始，却很快结束？这种模式在心理学中被称为<strong>强迫性重复</strong>——我们无意识地重复童年时期熟悉的关系模式。</p><div class=\"highlight\">无论这个模式是痛苦的还是温暖的，我们都会不自觉地创造相似的情境。</div><p>比如，小时候习惯了忽冷忽热的父母关系，长大后就会无意识地寻找类似忽冷忽热的伴侣。这是因为熟悉感给了我们一种可控的错觉。</p><p>如何打破这个循环？首先要<strong>觉察</strong>——意识到自己在重复什么。其次是<strong>理解</strong>——这些模式背后的心理需求是什么。最后是<strong>选择</strong>——我有能力创造不同的结果。</p><p><strong>金句：</strong>真正的自由，是能够觉察并选择，而不是被无意识的模式操控。</p>"}, {"id": 11, "cat": "emotion", "tag": "情绪管理", "tagClass": "tag-emotion", "title": "焦虑型依恋自救指南：停止过度依赖", "date": "2026-04-09", "author": "王琳老师", "isFeatured": false, "excerpt": "焦虑型依恋者常常在关系中感到不安，过度依赖对方。这篇提供实用的自我调整方法。", "content": "<p>焦虑型依恋的人，在亲密关系中常常感到不安全——担心被抛弃、过度解读伴侣的行为，需要不断的确认来获得安全感。</p><div class=\"highlight\">焦虑型依恋的核心是对被抛弃的深层恐惧。</div><p>几个实用的自救方法：</p><p>1. <strong>情绪命名练习</strong>——当焦虑升起时，先深呼吸，命名你的情绪</p><p>2. <strong>行为中断法</strong>——想要立刻发消息确认时，先等10分钟</p><p>3. <strong>内在小孩对话</strong>——想象自己回到小时候，对那个害怕被抛弃的自己有话说</p><p>4. <strong>建立自我价值感</strong>——你的价值不取决于伴侣是否回复消息</p><p>记住：安全的依恋是可以<strong>后天培养</strong>的。觉察是第一步，改变从现在开始。</p>"}, {"id": 12, "cat": "family", "tag": "原生家庭", "tagClass": "tag-family", "title": "为什么你总是遇人不淑？", "date": "2026-04-09", "author": "王琳老师", "isFeatured": false, "excerpt": "有些人总是遇到不靠谱的伴侣，可能不是运气问题，而是你内心有一个熟悉的剧本。", "content": "<p>如果你反复遇到渣男或渣女，或者总是在关系中受伤，可能需要停下来思考：<strong>是不是我无意识地在选择这些人？</strong></p><div class=\"highlight\">我们往往会根据熟悉来选择伴侣，即使这种熟悉是痛苦的。</div><p>这叫做强迫性重复——大脑为了解决童年未解决的创伤，会无意识地寻找相似的情境，试图在新的关系中改写结局。但通常只会重复旧的创伤。</p><p>如何打破这个循环？</p><p>1. 回顾你的感情史，<strong>找出重复的模式</strong></p><p>2. 问自己：这个人身上有什么特质吸引了我？</p><p>3. 这个特质是否与父母之一相似？</p><p>4. <strong>有意识地选择</strong>与熟悉类型不同的人</p><p><strong>金句：</strong>认识到我在重复什么，是改变的第一步。</p>"}, {"id": 13, "cat": "love", "tag": "婚恋心理", "tagClass": "tag-love", "title": "回避型依恋者的内心独白：不是不想爱，是不敢", "date": "2026-04-10", "author": "王琳老师", "isFeatured": false, "excerpt": "回避型依恋者常常被误解为不需要爱，但其实他们只是不知道如何面对亲密。", "content": "<p>我不想谈恋爱、我一个人挺好的——回避型依恋者常常这样说。但真相是：<strong>不是不想爱，是不敢爱。</strong></p><div class=\"highlight\">回避型依恋的形成，通常源于小时候照顾者的情感忽视。</div><p>当一个小孩子表达需求总是被忽视，他学会了：表达也没用，反正没人会回应。于是他压抑了所有对亲密的需求，看起来不需要任何人。</p><p>但内心深处，回避型依恋者其实渴望连接，只是不敢相信有人会真正回应他们。</p><p>如果你或你的伴侣是回避型依恋：</p><p>1. <strong>理解</strong>——这不是不在乎，而是太害怕在乎</p><p>2. <strong>给空间</strong>——不要逼迫，给他们安全感</p><p>3. <strong>耐心</strong>——改变需要时间</p><p>4. <strong>示范</strong>——展示安全的依恋是什么样的</p><p><strong>金句：</strong>每个人的不需要背后，可能藏着一个不敢要。</p>"}, {"id": 14, "cat": "growth", "tag": "自我成长", "tagClass": "tag-growth", "title": "停止精神内耗：从想太多到做决定", "date": "2026-04-10", "author": "王琳老师", "isFeatured": false, "excerpt": "精神内耗是现代人的通病——反复纠结、犹豫不决、过度思考。几个实用方法帮你走出内耗。", "content": "<p>你有没有过这样的体验：一件事反复想，想到头疼，却还是做不了决定？这就是<strong>精神内耗</strong>——心理上的过度消耗。</p><div class=\"highlight\">内耗的根源往往是对做错决定的恐惧。</div><p>几个走出内耗的方法：</p><p>1. <strong>2分钟法则</strong>——如果这件事2分钟内能决定，就立刻决定，不要想</p><p>2. <strong>最坏情况法</strong>——问自己：最坏的情况是什么？我能接受吗？通常没你想的那么可怕</p><p>3. <strong>行动优先</strong>——想不清楚就先行动，在行动中调整</p><p>4. <strong>设定思考时限</strong>——给自己30分钟做决定，时间到了就选</p><p>记住：<strong>完美的决定不存在</strong>，但不决定永远不会让事情变好。</p><p><strong>金句：</strong>想，都是问题；做，才有答案。</p>"}, {"id": 15, "cat": "emotion", "tag": "情绪管理", "tagClass": "tag-emotion", "title": "如何和负面情绪做朋友", "date": "2026-04-10", "author": "王琳老师", "isFeatured": false, "excerpt": "我们常常想赶走负面情绪，但情绪是信使。学会读懂情绪传递的信息，才能真正疗愈。", "content": "<p>焦虑、愤怒、悲伤——我们本能地想赶走这些负面情绪。但<strong>情绪是信使，不是敌人</strong>。每种情绪都在传递信息。</p><div class=\"highlight\">焦虑 = 提醒你某件事需要准备或关注；愤怒 = 提醒你边界被侵犯；悲伤 = 提醒你失去了重要的东西。</div><p>如何与情绪做朋友？</p><p>1. <strong>觉察</strong>——现在感受到了什么情绪？</p><p>2. <strong>接受</strong>——允许它存在，不评判</p><p>3. <strong>询问</strong>——这个情绪想告诉我什么？</p><p>4. <strong>行动</strong>——回应情绪传递的信息，而不是被情绪控制</p><p><strong>金句：</strong>不是我没有焦虑，而是焦虑想告诉我什么。</p>"}, {"id": 16, "cat": "love", "tag": "婚恋心理", "tagClass": "tag-love", "title": "长期关系的秘诀：不是找到对的人，而是成为对的人", "date": "2026-04-11", "author": "王琳老师", "isFeatured": false, "excerpt": "很多人以为幸福就是遇到对的人，但心理学的答案是：幸福是一种能力。", "content": "<p>很多人相信：幸福的关键是<strong>找到对的人</strong>。但心理学研究告诉我们：幸福的关键是<strong>拥有幸福的能力</strong>。</p><div class=\"highlight\">一个人格成熟的人，跟谁在一起都可能幸福；一个人格不成熟的人，跟谁在一起都可能不幸。</div><p>幸福的能力包括：情绪管理能力、沟通能力、冲突处理能力、自我认知能力。</p><p>所以，与其花时间寻找对的人，不如<strong>花时间成为对的人</strong>。当你准备好了，那个对的人自然会出现。</p><p><strong>金句：</strong>你若盛开，清风自来。</p>"}, {"id": 17, "cat": "family", "tag": "原生家庭", "tagClass": "tag-family", "title": "原生家庭欠你的，你要自己找回来", "date": "2026-04-11", "author": "王琳老师", "isFeatured": false, "excerpt": "童年缺爱不是你的错，但成年后自我补给是你的责任。几个方法帮你修复内心小孩。", "content": "<p>很多人小时候没有得到足够的爱——也许父母太忙，也许他们也不懂爱。这些缺失让你在成年后依然感到空虚、不安全、不被爱。</p><div class=\"highlight\">原生家庭欠你的，你要自己找回来。</div><p>如何自我补给？</p><p>1. <strong>觉察内心小孩</strong>——想象小时候的你，感受他的情绪</p><p>2. <strong>对话疗愈</strong>——对那个小孩说：我理解你当时的感受，你不是孤单的</p><p>3. <strong>满足需求</strong>——成年后的你，现在可以给那个小孩当年没有的东西</p><p>4. <strong>建立新经验</strong>——在新的关系中，创造被爱的体验，覆盖旧记忆</p><p><strong>金句：</strong>你不是缺爱，你是忘记了自己也值得被爱。</p>"}, {"id": 18, "cat": "growth", "tag": "自我成长", "tagClass": "tag-growth", "title": "高敏感是一种天赋，不是缺陷", "date": "2026-04-11", "author": "王琳老师", "isFeatured": false, "excerpt": "高敏感人群常被误解为太玻璃心，但研究表明高敏感是一种天赋。", "content": "<p>你是不是很容易被小事影响？别人一个眼神就能让你想很多？常常感到疲惫？——你可能是<strong>高敏感人群（HSP）</strong>。</p><div class=\"highlight\">高敏感不是病，而是一种神经系统更敏感的天赋。</div><p>HSP的特点：能够感知到细微的变化、情绪反应更深、需要更多独处时间来恢复能量、思考深入，追求意义。</p><p>如何发挥HSP的优势：</p><p>1. <strong>接受</strong>——接纳这个特质</p><p>2. <strong>选择环境</strong>——避免过度刺激的环境</p><p>3. <strong>发挥优势</strong>——HSP适合需要洞察力、共情力的工作</p><p><strong>金句：</strong>敏感不是软肋，敏锐的感知力是你独特的天赋。</p>"}, {"id": 19, "cat": "love", "tag": "婚恋心理", "tagClass": "tag-love", "title": "分手后如何优雅地走出来？心理学的答案", "date": "2026-04-12", "author": "王琳老师", "isFeatured": false, "excerpt": "分手是痛苦的，但也是成长的契机。几个心理学方法帮你走出情伤。", "content": "<p>分手后的痛苦是真实的——大脑成像研究显示，失恋激活的脑区与身体疼痛激活的脑区相同。所以<strong>分手真的很疼</strong>，这不是矫情。</p><div class=\"highlight\">分手的痛苦是正常的，但痛苦会随时间减弱。</div><p>几个走出分手的方法：</p><p>1. <strong>允许悲伤</strong>——不要压抑，哭出来是疗愈的开始</p><p>2. <strong>减少接触</strong>——删除联系方式，减少社交媒体上的动态</p><p>3. <strong>重新叙事</strong>——回顾这段关系，写下学到的功课</p><p>4. <strong>重建身份</strong>——除了谁的男/女朋友，你是谁？</p><p>5. <strong>寻求支持</strong>——向朋友倾诉或寻求专业帮助</p><p><strong>金句：</strong>分手不是我不够好，而是我们不适合。</p>"}, {"id": 20, "cat": "emotion", "tag": "情绪管理", "tagClass": "tag-emotion", "title": "如何停止灾难性思维？", "date": "2026-04-12", "author": "王琳老师", "isFeatured": false, "excerpt": "事情还没发生，你就已经想到了最坏的结果？这是灾难性思维，几个方法帮你矫正。", "content": "<p>他没回消息，一定是不爱我了、这次汇报搞砸了，我肯定要被开除了——这种<strong>灾难性思维</strong>让焦虑者常常活在恐惧中。</p><div class=\"highlight\">灾难性思维 = 把可能当成必然，把小概率当成一定会发生。</div><p>如何矫正？</p><p>1. <strong>证据法</strong>——问自己：有什么证据支持这个想法？有什么证据反对？</p><p>2. <strong>概率评估</strong>——这件事实际发生的概率是多少？</p><p>3. <strong>替代思维</strong>——即使这件事发生了，最坏的情况真的是我无法承受的吗？</p><p>4. <strong>聚焦行动</strong>——我能做什么来预防最坏情况？</p><p><strong>金句：</strong>你的想象比现实更可怕。</p>"}, {"id": 21, "cat": "family", "tag": "原生家庭", "tagClass": "tag-family", "title": "你和父母的关系，决定了你和伴侣的关系", "date": "2026-04-12", "author": "王琳老师", "isFeatured": false, "excerpt": "心理学研究表明，我们早年与父母的关系模式，会无意识地复制到成年后的亲密关系中。", "content": "<p>你有没有发现：你和伴侣吵架的模式，和小时候和父母冲突的模式很像？——这是<strong>关系模式的强迫性重复</strong>。</p><div class=\"highlight\">我们往往会根据内在关系模板来选择和对待伴侣。</div><p>如何打破这个循环？</p><p>1. <strong>觉察</strong>——观察你与伴侣的互动模式，与童年记忆对比</p><p>2. <strong>理解</strong>——认识到这是旧模式，不是命运</p><p>3. <strong>选择</strong>——刻意用不同的方式回应</p><p><strong>金句：</strong>过去的关系模式不是你的错，但打破它是你自己的责任。</p>"}, {"id": 22, "cat": "love", "tag": "婚恋心理", "tagClass": "tag-love", "title": "为什么付出型的人总是不被珍惜？", "date": "2026-04-13", "author": "王琳老师", "isFeatured": false, "excerpt": "付出型人格在关系中常常感到委屈：为什么我付出那么多，对方却不珍惜？", "content": "<p>付出型的人常说：我为他付出了那么多，他怎么可以这样对我？——这个问题本身就藏着答案。</p><div class=\"highlight\">健康的付出 = 发自内心愿意给，同时能够拒绝。</div><p>不健康的付出模式：讨好型付出、牺牲型付出、控制型付出。</p><p>如何从付出型转变为<strong>平衡型</strong>？</p><p>1. <strong>觉察动机</strong>——问自己：我为什么想付出？是爱还是恐惧？</p><p>2. <strong>学会拒绝</strong>——你有权说不</p><p>3. <strong>设定边界</strong>——付出要在不伤害自己的前提下</p><p><strong>金句：</strong>真正的爱不要求你牺牲自己。</p>"}, {"id": 23, "cat": "growth", "tag": "自我成长", "tagClass": "tag-growth", "title": "如何建立健康的个人边界？", "date": "2026-04-13", "author": "王琳老师", "isFeatured": false, "excerpt": "很多人不敢设立边界，害怕破坏关系。但不设边界的关系迟早会崩溃。", "content": "<p>边界是什么？边界是<strong>我能接受和不能接受的底线</strong>。没有边界的人，就像没有门的房子，谁都可以随意进出。</p><div class=\"highlight\">边界不是墙，而是让关系更健康的过滤器。</div><p>几个设立边界的方法：</p><p>1. <strong>识别感受</strong>——当你不舒服时，问自己：什么被侵犯了？</p><p>2. <strong>清晰表达</strong>——用我感到...因为...我希望...的方式表达</p><p>3. <strong>坚持底线</strong>——对方可能会试探底线，你必须坚持</p><p>4. <strong>接受后果</strong>——设立边界可能会让一些人不满，这是正常的</p><p><strong>金句：</strong>有边界的人，反而更容易被尊重。</p>"}, {"id": 24, "cat": "emotion", "tag": "情绪管理", "tagClass": "tag-emotion", "title": "为什么你总是想太多，做太少？", "date": "2026-04-13", "author": "王琳老师", "isFeatured": false, "excerpt": "过度思考是行动的敌人。几个方法帮你从思考瘫痪中解脱。", "content": "<p>想太多，做太少——这是很多人的生活困境。想的原因是<strong>完美主义+恐惧失败</strong>。</p><div class=\"highlight\">过度思考是逃避行动的借口。</div><p>如何从思考转向行动？</p><p>1. <strong>设定思考时间</strong>——比如我只能想这件事30分钟</p><p>2. <strong>2分钟法则</strong>——任何能在2分钟内做完的事，立刻做</p><p>3. <strong>接受不完美开始</strong>——先开始，再完善</p><p>4. <strong>行动优先于思考</strong>——做着动着就清楚了</p><p><strong>金句：</strong>完成比完美重要，先完成再迭代。</p>"}, {"id": 25, "cat": "love", "tag": "婚恋心理", "tagClass": "tag-love", "title": "亲密关系中的依恋伤害：如何修复？", "date": "2026-04-14", "author": "王琳老师", "isFeatured": false, "excerpt": "过去的感情创伤会在新关系中浮现。理解依恋伤害，才能真正开始新的篇章。", "content": "<p>有些人一旦在感情中受伤，下次恋爱就会变得更加防备：不敢信任、过度警惕、随时准备撤退——这叫做<strong>依恋伤害</strong>。</p><div class=\"highlight\">依恋伤害让我们在新的关系中重复旧的防御模式。</div><p>如何修复？</p><p>1. <strong>承认伤害</strong>——不是我太敏感，而是我确实受伤过</p><p>2. <strong>理解模式</strong>——认识到这些防御是为了保护旧伤口</p><p>3. <strong>安全体验</strong>——在新的安全关系中，慢慢建立信任</p><p>4. <strong>寻求帮助</strong>——如果伤害太深，心理咨询是有效的方式</p><p><strong>金句：</strong>过去的伤疤不是你的错，但照顾好它是你的责任。</p>"}, {"id": 26, "cat": "family", "tag": "原生家庭", "tagClass": "tag-family", "title": "与父母和解，是放过自己", "date": "2026-04-14", "author": "王琳老师", "isFeatured": false, "excerpt": "很多人困在对父母的怨恨中。原谅不是为了他们，而是为了让自己自由。", "content": "<p>恨父母是容易的，但恨一辈子太累了。很多人困在对父母的怨恨中，无法解脱。</p><div class=\"highlight\">与父母和解不是他们值得原谅，而是我值得自由。</div><p>和解的步骤：</p><p>1. <strong>承认伤痛</strong>——允许自己说他们确实伤害了我</p><p>2. <strong>理解局限</strong>——他们也是创伤的受害者，他们也只是普通人</p><p>3. <strong>放下期待</strong>——不再期待他们会改变或道歉</p><p>4. <strong>自我疗愈</strong>——做自己的好父母，给内心小孩无条件的爱</p><p><strong>金句：</strong>放下不是原谅，是放过自己。</p>"}, {"id": 27, "cat": "growth", "tag": "自我成长", "tagClass": "tag-growth", "title": "如何培养心理弹性？", "date": "2026-04-14", "author": "王琳老师", "isFeatured": false, "excerpt": "心理弹性=抗挫力。遇到困难能恢复的能力，决定了一个人能走多远。", "content": "<p>心理弹性（Resilience）是指从挫折中<strong>恢复</strong>的能力。遇到同样的困难，有些人很快恢复，有些人却一蹶不振——区别就在心理弹性。</p><div class=\"highlight\">心理弹性不是天生的，是可以培养的。</div><p>如何培养心理弹性？</p><p>1. <strong>建立支持系统</strong>——有人可以倾诉，有人在你困难时陪伴</p><p>2. <strong>培养成长思维</strong>——把困难看作学习机会而不是失败</p><p>3. <strong>情绪调节能力</strong>——学会在压力下保持冷静</p><p>4. <strong>意义感</strong>——有比眼前的困难更长远的目标</p><p>5. <strong>自我照顾</strong>——睡眠、运动、休息，让身心保持良好状态</p><p><strong>金句：</strong>心理弹性强的人不是没有倒下，而是倒下了还能爬起来。</p>"}, {"id": 28, "cat": "love", "tag": "婚恋心理", "tagClass": "tag-love", "title": "单身不必焦虑：高质量独处是最好的增值期", "date": "2026-04-15", "author": "王琳老师", "isFeatured": false, "excerpt": "单身时感到焦虑？把单身期当作自我成长的最好时机。", "content": "<p>很多人因为单身焦虑而急于进入一段关系，结果往往是换一个人重复同样的问题。</p><div class=\"highlight\">单身不是等待被爱，而是学会爱自己的时期。</div><p>单身期可以做什么？</p><p>1. <strong>自我探索</strong>——了解自己喜欢什么、想要什么、不接受什么</p><p>2. <strong>发展兴趣</strong>——培养一两个能带来快乐的爱好</p><p>3. <strong>技能提升</strong>——工作，学习，新能力</p><p>4. <strong>疗愈旧伤</strong>——如果有未处理的情感创伤，单身期是最好的疗愈时机</p><p>记住：<strong>准备好的人，更容易遇到对的人</strong>。当你享受单身，对的人才会出现。</p><p><strong>金句：</strong>你若精彩，天自安排。</p>"}, {"id": 29, "cat": "emotion", "tag": "情绪管理", "tagClass": "tag-emotion", "title": "如何识别和处理情感压抑？", "date": "2026-04-15", "author": "王琳老师", "isFeatured": false, "excerpt": "情感压抑让人看起来没事，但长期压抑会导致心理和身体问题。", "content": "<p>很多人习惯了压抑情绪：我不能哭、我不应该生气、我要坚强。但长期压抑情绪会让人<strong>内心空虚、与自己断开连接</strong>。</p><div class=\"highlight\">情感压抑不是坚强，是慢性自我伤害。</div><p>情感压抑的表现：身体症状但查不出病、对很多事情没感觉、偶尔情绪爆发、难以描述自己的感受。</p><p>如何开始解封情绪？</p><p>1. <strong>命名情绪</strong>——每天问自己我现在感受到什么情绪</p><p>2. <strong>允许存在</strong>——不评判情绪的好坏，允许它存在</p><p>3. <strong>表达出来</strong>——写日记、找信任的人倾诉</p><p>4. <strong>寻求帮助</strong>——如果自己很难突破，心理咨询可以提供安全空间</p><p><strong>金句：</strong>情绪不是你的敌人，情绪是你的信使。</p>"}, {"id": 30, "cat": "family", "tag": "原生家庭", "tagClass": "tag-family", "title": "如何打破父母关系的代际传承？", "date": "2026-04-15", "author": "王琳老师", "isFeatured": false, "excerpt": "我们的很多行为模式来自父母的传承。觉察并打破这个循环，是给孩子最好的礼物。", "content": "<p>很多人在做了父母后，突然发现自己<strong>说的话、做事的方式，和自己的父母一模一样</strong>。这就是代际传承。</p><div class=\"highlight\">传承不只是基因，还有关系模式和情感模式。</div><p>如何打破代际传承？</p><p>1. <strong>觉察传承</strong>——注意自己在教育子女时，哪些方式来自自己的父母</p><p>2. <strong>理解影响</strong>——理解父母的创伤如何影响了你</p><p>3. <strong>刻意选择</strong>——有意识地选择与父母不同的方式</p><p>4. <strong>创造新模式</strong>——阅读、学习、寻求帮助，建立新的教育方式</p><p>5. <strong>自我疗愈</strong>——疗愈自己的创伤，才能不把创伤传给孩子</p><p><strong>金句：</strong>觉醒的一代，就是打破循环的一代。</p>"}, {"id": 31, "cat": "love", "tag": "婚恋心理", "tagClass": "tag-love", "title": "好的亲密关系，是让彼此成为更好的人", "date": "2026-04-16", "author": "王琳老师", "isFeatured": true, "excerpt": "最好的爱情不是你属于我，而是我们在一起，各自更好。", "content": "<p>什么是好的亲密关系？不是你属于我，也不是我们融为一体，而是<strong>在关系中，两个人都比单身时更好</strong>。</p><div class=\"highlight\">好的关系是让你更有力量，而不是更加依赖。</div><p>好的亲密关系的标志：</p><p>1. <strong>彼此支持</strong>——支持对方的梦想，而不是要求对方放弃</p><p>2. <strong>保持独立</strong>——有自己的空间、兴趣、朋友圈</p><p>3. <strong>共同成长</strong>——一起学习、一起进步</p><p>4. <strong>互相成就</strong>——因为有你，我成为了更好的人</p><p>5. <strong>真实表达</strong>——可以坦诚表达任何想法和感受</p><p>记住：<strong>好的爱情是锦上添花，不是雪中送炭</strong>。先是一个完整的自己，然后是两个完整的人在一起。</p><p><strong>金句：</strong>最好的关系，是让你更爱自己，也更懂如何爱别人。</p>"}, {"id": 32, "cat": "growth", "tag": "自我成长", "tagClass": "tag-growth", "title": "今天开始：停止比较，专注自己的成长", "date": "2026-04-16", "author": "王琳老师", "isFeatured": false, "excerpt": "社交媒体让人们更容易陷入比较。但每个人的时区不同，你只在自己的时区里。", "content": "<p>你是不是经常刷朋友圈或社交媒体，然后感到焦虑：为什么别人都比我成功？——这是<strong>社交比较陷阱</strong>。</p><div class=\"highlight\">社交媒体展示的是精选的高光时刻，不是真实的生活。</div><p>如何停止比较？</p><p>1. <strong>认识比较的危害</strong>——比较让人自卑、焦虑，破坏幸福感</p><p>2. <strong>限制社交媒体时间</strong>——每天给自己设定社交媒体时间</p><p>3. <strong>关注自己的成长</strong>——把注意力从别人怎样转向我今天学到了什么</p><p>4. <strong>练习感恩</strong>——每天写下3件让你感恩的事</p><p>5. <strong>记住：每个人的起点和时区不同</strong>——有人22岁成功，有人50岁成功，关键是走在自己的路上</p><p><strong>金句：</strong>你的对手只有一个人——昨天的自己。</p>"}, {"id": 33, "cat": "emotion", "tag": "情绪管理", "tagClass": "tag-emotion", "title": "自我觉察日记：了解自己的情绪地图", "date": "2026-04-16", "author": "王琳老师", "isFeatured": false, "excerpt": "自我觉察是情绪管理的基础。坚持写情绪日记，绘制你的情绪地图。", "content": "<p>想要管理情绪，首先需要<strong>觉察情绪</strong>。而觉察情绪最好的工具之一，就是情绪日记。</p><div class=\"highlight\">写情绪日记不是记流水账，而是深入探索情绪的来源和意义。</div><p>情绪日记模板：</p><p>1. <strong>发生了什么？</strong>（情境）</p><p>2. <strong>我感受到了什么情绪？</strong>（情绪命名）</p><p>3. <strong>这个情绪有多强烈？</strong>（1-10分）</p><p>4. <strong>这个情绪想告诉我什么？</strong>（情绪信息）</p><p>5. <strong>我需要做什么？</strong>（行动）</p><p>坚持写2-4周，你会发现自己情绪的模式和触发点，从而<strong>真正成为情绪的主人</strong>。</p><p><strong>金句：</strong>当你开始觉察，成长就已经开始了。</p>"}, {"id": 34, "cat": "love", "tag": "婚恋心理", "tagClass": "tag-love", "title": "为什么有些人总在关系里测试对方？", "date": "2026-04-17", "author": "王琳老师", "isFeatured": false, "excerpt": "反复确认对方会不会离开，这可能不是你不信任，而是依恋焦虑在作祟。", "content": "<p>有些人谈恋爱，总喜欢测试伴侣：故意发脾气、故意不回复消息。</p><p>表面看起来是作，深层原因是<strong>依恋焦虑</strong>——内心深处的不安全感，让他们无法相信自己是值得被爱的。</p><div class=\"highlight\">每一次测试，其实都是在问：我真的可以相信你会留下来吗？</div><p>如何打破这个循环？</p><p>1. <strong>觉察</strong>——意识到自己在测试，而不是真的想要结果</p><p>2. <strong>表达真实需求</strong>——把“你居然没挽留我”换成“我很害怕你会离开”</p><p>3. <strong>建立安全感</strong>——在安全的关系中，慢慢学会信任</p><p><strong>金句：</strong>你不需要证明爱，你只需要选择相信。</p>"}, {"id": 35, "cat": "emotion", "tag": "情绪管理", "tagClass": "tag-emotion", "title": "情绪崩溃时，你需要一个心理急救包", "date": "2026-04-17", "author": "王琳老师", "isFeatured": false, "excerpt": "情绪风暴来临时，我们常常手足无措。几个简单的急救方法，帮你快速稳定。", "content": "<p>当你感到情绪即将崩溃时，大脑会切换到战斗模式，理性思考几乎不可能。</p><div class=\"highlight\">情绪急救的关键不是想通，而是先让身体平静下来。</div><p>几个有效的急救方法：</p><p>1. <strong>54321 grounding</strong>——说出5样看到的、4样触摸到的、3样听到的</p><p>2. <strong>冷敷</strong>——用冷水洗脸，激活身体的休息反应</p><p>3. <strong>慢呼吸</strong>——吸气4秒，屏住2秒，呼气6秒，重复3次</p><p>4. <strong>离开现场</strong>——给自己一个物理空间，等情绪峰值过去</p><p><strong>金句：</strong>崩溃不是软弱，是在提醒你需要照顾自己了。</p>"}, {"id": 36, "cat": "growth", "tag": "自我成长", "tagClass": "tag-growth", "title": "为什么你总觉得自己不够好？", "date": "2026-04-17", "author": "王琳老师", "isFeatured": false, "excerpt": "无论多成功都无法满足的内在声音，可能是内在批判者在作祟。", "content": "<p>你有没有这样的体验：明明已经很不错了，但内心总有一个声音在说“你还不够好”？</p><p>心理学上这叫<strong>内在批判者</strong>（Inner Critic）——一个持续评判、批评、否定自己的声音。</p><div class=\"highlight\">内在批判者不是你自己，它是你早年环境中形成的保护机制。</div><p>它会放大错误、忽视成就，让你永远觉得自己不够。</p><p>如何应对？</p><p>1. <strong>命名它</strong>——给这个声音取个名字，比如“小评判”</p><p>2. <strong>拉开距离</strong>——当它出现时，说“谢谢你的提醒，但我不需要你”</p><p>3. <strong>补充证据</strong>——刻意列出自己的成就，打破它的垄断</p><p><strong>金句：</strong>你已经足够好了，不是因为你做了什么，而是因为你是你。</p>"}]};

function showSkeleton() {
  document.getElementById('featuredContainer').innerHTML = `
    <div class="skeleton-card" style="margin:0 0 16px;background:linear-gradient(135deg,#e8e4ff,#f0eeff);">
      <div class="skeleton-line short" style="height:12px;"></div>
      <div class="skeleton-line long" style="height:18px;margin-top:8px;"></div>
      <div class="skeleton-line block" style="margin-top:8px;"></div>
    </div>`;
  document.getElementById('articleContainer').innerHTML = Array(4).fill().map(() =>
    `<div class="skeleton-card">
      <div class="skeleton-line short"></div>
      <div class="skeleton-line medium"></div>
      <div class="skeleton-line long"></div>
      <div class="skeleton-line block"></div>
    </div>`
  ).join('');
}

function loadArticles() {
  showSkeleton();
  articlesData = ARTICLES_JSON;
  const today = new Date().toISOString().slice(0, 10);
  allArticles = (articlesData.articles || []).map(a => ({
    ...a,
    isToday: a.date === today
  }));
  featuredArticle = allArticles.find(a => a.isToday)
    || allArticles.find(a => a.id === articlesData.daily_featured_id)
    || allArticles[0];
  renderFeatured();
  renderArticles(currentCat);
  const hint = document.getElementById('updateHint');
  if (articlesData.last_updated === today) {
    hint.textContent = `✨ 今日内容已更新`;
  } else if (articlesData.last_updated) {
    hint.textContent = `📅 内容更新于 ${articlesData.last_updated}`;
  }
}

let currentCat = 'all';
let allArticles = [];
let featuredArticle = null;
let articlesData = null;

function renderFeatured() {
  const container = document.getElementById('featuredContainer');
  if (!featuredArticle) { container.innerHTML = ''; return; }
  container.innerHTML = `
    <div class="featured-card" onclick="showDetail(${featuredArticle.id})">
      <div class="featured-label">⭐ 今日推荐</div>
      <div class="featured-title">${featuredArticle.title}</div>
      <div class="featured-excerpt">${featuredArticle.excerpt}</div>
      <div class="featured-footer">
        <span>👤 ${featuredArticle.author}</span>
        <span>阅读全文 →</span>
      </div>
    </div>`;
}

function renderArticles(cat) {
  const container = document.getElementById('articleContainer');
  let filtered = cat === 'all' ? allArticles : allArticles.filter(a => a.cat === cat);
  if (featuredArticle) filtered = filtered.filter(a => a.id !== featuredArticle.id);
  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="emoji">📭</div><p>暂无该分类文章</p></div>`;
    return;
  }
  container.innerHTML = filtered.map(a => `
    <div class="article-card" onclick="showDetail(${a.id})">
      <div class="article-meta">
        <span class="article-tag ${a.tagClass}">${a.tag}</span>
        ${a.isToday ? '<span class="badge badge-today">今日</span>' : ''}
        <span class="article-date">${a.date}</span>
      </div>
      <div class="article-title">${a.title}</div>
      <div class="article-excerpt">${a.excerpt}</div>
      <div class="article-footer">
        <span class="article-author">👤 ${a.author}</span>
        <span class="read-more">阅读全文 →</span>
      </div>
    </div>`).join('');
}

function showDetail(id) {
  const a = allArticles.find(article => article.id === id);
  if (!a) return;
  document.getElementById('articleList').style.display = 'none';
  const detail = document.getElementById('articleDetail');
  detail.classList.add('active');
  detail.innerHTML = `
    <div class="detail-header">
      <div class="detail-tag-row">
        <span class="article-tag ${a.tagClass}">${a.tag}</span>
        ${a.isToday ? '<span class="badge badge-today">今日</span>' : ''}
      </div>
      <div class="detail-title">${a.title}</div>
      <div class="detail-meta">👤 ${a.author} &nbsp;|&nbsp; 📅 ${a.date}</div>
    </div>
    <div class="detail-body">${a.content}</div>
    <div class="back-detail" onclick="hideDetail()">← 返回列表</div>`;
  window.scrollTo(0, 0);
}

function hideDetail() {
  document.getElementById('articleList').style.display = 'block';
  document.getElementById('articleDetail').classList.remove('active');
  window.scrollTo(0, 0);
}

document.querySelectorAll('.filter-tag').forEach(tag => {
  tag.addEventListener('click', () => {
    document.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
    tag.classList.add('active');
    currentCat = tag.dataset.cat;
    renderArticles(currentCat);
  });
});

loadArticles();
</script>

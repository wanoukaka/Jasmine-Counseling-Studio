# Jasmine Counseling Studio - Nginx 配置
# 部署路径：/etc/nginx/sites-available/jasmine.conf

server {
    listen 80;
    server_name jasminepsych.cn www.jasminepsych.cn;
    
    # 强制跳转 HTTPS（域名绑定后启用）
    # return 301 https://$server_name$request_uri;

    # 前端静态文件
    root /var/www/jasmine/h5;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # 前端路由（Vue/React history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket（早晚报推送等）
    location /ws/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # 禁止访问敏感目录
    location ~ /\. {
        deny all;
    }

    # 日志
    access_log /var/log/nginx/jasmine_access.log;
    error_log /var/log/nginx/jasmine_error.log;
}

